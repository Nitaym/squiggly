; Supervisor config for the Squiggly DEV container.
;
; Differences from production (supervisord.conf):
;   - Next.js runs `next dev` for HMR instead of `next start`.
;   - Gunicorn runs with --reload and a single worker so file changes under
;     api/workers/ trigger an in-place reload. `gunicorn --reload` watches
;     every imported Python module, so all worker files are covered.
;   - All program stdout/stderr is routed to the container's stdout/stderr
;     (/dev/fd/1, /dev/fd/2) so `docker compose logs -f` shows everything
;     without exec-ing into the container.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:postgresql]
command=/bin/bash -c "exec $(ls -d /usr/lib/postgresql/*/bin/postgres | head -1) -D /data/postgres"
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PGDATA="/data/postgres"

[program:python-worker]
command=gunicorn --bind 0.0.0.0:8000 --workers 1 --reload --timeout 600 server:app
directory=/app/api/workers
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",STORAGE_MODE="local",STORAGE_PATH="/data/storage",DATABASE_URL="postgresql://squiggly:squiggly@localhost:5432/squiggly"

[program:nextjs]
command=npx next dev -p 3000
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=20
startretries=3
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=NODE_ENV="development",PORT="3000",DEPLOYMENT_MODE="docker",DATABASE_MODE="postgres",STORAGE_MODE="local",AUTH_MODE="local",DATABASE_URL="postgresql://squiggly:squiggly@localhost:5432/squiggly",WORKER_SERVICE_URL="http://localhost:8000",STORAGE_PATH="/data/storage",WATCHPACK_POLLING="true",CHOKIDAR_USEPOLLING="true",CHOKIDAR_INTERVAL="500",NEXT_TELEMETRY_DISABLED="1"

[program:admin-setup]
command=/bin/bash -c "sleep 10 && node /app/scripts/create-admin.js"
autostart=true
autorestart=false
startsecs=0
priority=40
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=DATABASE_URL="postgresql://squiggly:squiggly@localhost:5432/squiggly"
