version: '3.8'

services:
  squiggly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squiggly
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - squiggly-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  squiggly-data:
    driver: local
